name: Release macOS Actuation Control (Pro)

on:
  push:
    tags:
      - 'mac-v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  # JOB 1: LINUX BUILD (x64)
  # Produces: .tar.gz, .deb, .rpm
  # ------------------------------------------------------------------
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.13' }
      - run: pip install pyinstaller paramiko

      # 1. Build the Binary
      # Note: I am using 'macos_actuation_controlmacos_actuation.py' based on your uploaded files.
      # If your file is named 'macos_actuation_control.py', please update the line below.
      - name: Build Binary
        run: pyinstaller --onefile --name macos-actuation macos_actuation_controlmacos_actuation.py

      # 2. Prepare Version Number (Strip 'mac-v' from tag)
      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#mac-v}" >> $GITHUB_OUTPUT

      # 3. Create TAR.GZ Archive
      - name: Create Tarball
        run: |
          tar -czvf macos-actuation-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz -C dist macos-actuation

      # 4. Install Packaging Tools (FPM)
      - name: Install FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      # 5. Create DEB Package (Debian/Ubuntu)
      - name: Create DEB
        run: |
          # Create a fake install structure
          mkdir -p pkg-root/usr/local/bin
          cp dist/macos-actuation pkg-root/usr/local/bin/
          
          fpm -s dir -t deb \
            -n macos-actuation \
            -v ${{ steps.version.outputs.VERSION }} \
            --architecture amd64 \
            --description "macOS Actuation Controller CLI" \
            -C pkg-root . \
            -p macos-actuation-${{ steps.version.outputs.VERSION }}-linux-x64.deb

      # 6. Create RPM Package (RedHat/CentOS)
      - name: Create RPM
        run: |
          fpm -s dir -t rpm \
            -n macos-actuation \
            -v ${{ steps.version.outputs.VERSION }} \
            --architecture x86_64 \
            --description "macOS Actuation Controller CLI" \
            -C pkg-root . \
            -p macos-actuation-${{ steps.version.outputs.VERSION }}-linux-x64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: |
            *.tar.gz
            *.deb
            *.rpm

  # ------------------------------------------------------------------
  # JOB 2: MACOS MATRIX BUILD (Intel & Apple Silicon)
  # Produces: .tar.gz, .pkg
  # ------------------------------------------------------------------
  build-macos:
    name: build-macos-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-13    # Intel Mac Runner
            arch: x64
          - os: macos-14    # Apple Silicon (M1) Runner
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.13' }
      - run: pip install pyinstaller paramiko

      - name: Build Binary
        run: pyinstaller --onefile --name macos-actuation macos_actuation_controlmacos_actuation.py

      - name: Get Version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#mac-v}" >> $GITHUB_OUTPUT

      - name: Create Tarball
        run: |
          tar -czvf macos-actuation-${{ steps.version.outputs.VERSION }}-osx-${{ matrix.arch }}.tar.gz -C dist macos-actuation

      - name: Create PKG Installer
        run: |
          # Structure for /usr/local/bin
          mkdir -p pkg-root/usr/local/bin
          cp dist/macos-actuation pkg-root/usr/local/bin/
          
          # Build PKG
          pkgbuild --root pkg-root \
            --identifier com.github.macos-actuation \
            --version ${{ steps.version.outputs.VERSION }} \
            --install-location / \
            macos-actuation-${{ steps.version.outputs.VERSION }}-osx-${{ matrix.arch }}.pkg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-assets-${{ matrix.arch }}
          path: |
            *.tar.gz
            *.pkg

  # ------------------------------------------------------------------
  # JOB 3: WINDOWS BUILD (x64)
  # Produces: .zip
  # ------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.13' }
      - run: pip install pyinstaller paramiko

      - name: Build Binary
        run: pyinstaller --onefile --name macos-actuation.exe macos_actuation_controlmacos_actuation.py
      
      - name: Get Version
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#mac-v}" >> $GITHUB_OUTPUT

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path dist/macos-actuation.exe -DestinationPath macos-actuation-${{ steps.version.outputs.VERSION }}-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            *.zip

  # ------------------------------------------------------------------
  # JOB 4: RELEASE
  # ------------------------------------------------------------------
  release:
    needs: [build-linux-x64, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Download all artifacts from previous jobs
      - uses: actions/download-artifact@v4
        with:
          path: ./assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./assets/*